services:
  db:
    image: postgres:16-alpine
    container_name: bank_customer_db
    restart: always
    environment:
      POSTGRES_DB: bank_customer_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bank_customer_api
    restart: always
    command: sh -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8000"
    environment:
      DJANGO_DEBUG: "true"
      DATABASE_URL: "postgresql://postgres:postgrespassword@db:5432/bank_customer_db"
      DJANGO_ALLOWED_HOSTS: "*"
      CORS_ALLOW_ALL_ORIGINS: "true"
    ports:
      - "8000:8000"
    depends_on:
      - db

volumes:
  pgdata:
